<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">

<style>
:root{--bg:#fff8df;--card:#fff;--ink:#1f2937;--muted:#64748b;--accent:#ffd75e;--blue:#52bdf2;--green:#75cf8a}
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:linear-gradient(#fff7d6,#eef9ff);color:var(--ink);min-height:100vh}
.app{max-width:760px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-weight:900;font-size:28px}.progress{font-weight:800;background:#fff;padding:9px 13px;border-radius:16px;box-shadow:0 3px 12px #0001}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.controls button,.controls select{border:0;border-radius:16px;padding:11px 14px;background:#fff;font-weight:800;box-shadow:0 3px 10px #0001}.controls button.active{background:var(--accent)}
.card{background:var(--card);border-radius:30px;padding:20px;box-shadow:0 10px 30px #0002;text-align:center}.tag{display:inline-block;background:#e7f7ea;color:#25833c;padding:7px 13px;border-radius:999px;font-weight:900}
.photoWrap{margin:14px auto 8px;width:min(100%,520px);height:290px;border-radius:24px;overflow:hidden;background:#eef2f7;display:grid;place-items:center;position:relative}
.photo{width:100%;height:100%;object-fit:cover;display:none}.fallback{font-size:110px}.word{font-size:46px;font-weight:950;margin-top:7px}.sentence{font-size:21px;line-height:1.45;margin:10px auto;max-width:620px}
.row{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}.btn{border:0;border-radius:18px;padding:12px 16px;font-size:17px;font-weight:900;cursor:pointer}.listen{background:var(--blue)}.storyBtn{background:var(--green)}.video{background:#ff8a80}.master{background:#ffe082}.next{background:#ffb74d}
.story{margin:15px auto 0;max-width:620px;text-align:left;background:#fff8e7;padding:16px;border-radius:18px;font-size:18px;line-height:1.5}
.quiz{margin-top:14px;background:#eef7ff;padding:15px;border-radius:18px;text-align:left}.quiz button{display:block;width:100%;margin:7px 0;border:0;border-radius:14px;padding:11px;text-align:left;background:#fff;font-weight:800}
.stats{margin-top:14px;background:#fff;border-radius:20px;padding:14px;display:none}.bar{height:12px;background:#eee;border-radius:9px;overflow:hidden}.bar>div{height:100%;background:#7bcf8d;width:0}
.small{font-size:13px;color:var(--muted)} .search{flex:1;min-width:180px}
@media(max-width:560px){.brand{font-size:22px}.photoWrap{height:230px}.word{font-size:38px}.sentence{font-size:19px}.btn{font-size:16px}.app{padding:12px}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="brand">🌈 Kids English 1000</div><div class="progress" id="progress">0 / 1000</div></div>
  <div class="controls">
    <button class="age active" data-age="3">3歲 · 300</button>
    <button class="age" data-age="4">4歲 · 600</button>
    <button class="age" data-age="5">5歲 · 1000</button>
    <select id="category"><option value="All">🎲 全部主題</option></select>
    <input class="search" id="search" placeholder="🔎 找單字，例如 elephant">
    <button id="review">🔁 複習</button>
    <button id="statsBtn">📊 進度</button>
  </div>

  <div class="stats" id="stats">
    <b>學習進度</b>
    <div style="margin:9px 0" class="bar"><div id="barFill"></div></div>
    <div id="statsText"></div>
  </div>

  <div class="card">
    <div class="tag" id="tag">Animals</div>
    <div class="photoWrap">
      <img class="photo" id="photo" alt="">
      <div class="fallback" id="fallback">🐾</div>
    </div>
    <div class="word" id="word">Loading…</div>
    <div class="small" id="sourceNote">圖片：Wikipedia/Wikimedia；影片：官方來源搜尋</div>
    <div class="sentence" id="sentence"></div>

    <div class="row">
      <button class="btn listen" id="listen">🔊 發音</button>
      <button class="btn storyBtn" id="readStory">📖 唸故事</button>
      <button class="btn video" id="video">🎬 短影片</button>
      <button class="btn master" id="master">⭐ 我會了</button>
    </div>

    <div class="story" id="story"></div>
    <div class="quiz" id="quiz"></div>

    <div class="row" style="margin-top:14px">
      <button class="btn next" id="next">下一個 ➜</button>
    </div>
  </div>
</div>

ategory":"Home","emoji":"🏠","level":3,"sentence3":"This is a gate.","sentence4":"Look at the gate. Can you find one around you?","sentence5":"Let's learn the word gate, what it means, and where we might see or use it.","story":"We notice a gate. We say its name, look carefully, and use the word in a simple sentence.","videoProvider":"DK Books"},{"id":999,"word":"globe","lookup":"globe","category":"Home","emoji":"🏠","level":3,"sentence3":"This is a globe.","sentence4":"Look at the globe. Can you find one around you?","sentence5":"Let's learn the word globe, what it means, and where we might see or use it.","story":"We notice a globe. We say its name, look carefully, and use the word in a simple sentence.","videoProvider":"DK Books"},{"id":1000,"word":"hammock","lookup":"hammock","category":"Home","emoji":"🏠","level":3,"sentence3":"This is a hammock.","sentence4":"Look at the hammock. Can you find one around you?","sentence5":"Let's learn the word hammock, what it means, and where we might see or use it.","story":"We notice a hammock. We say its name, look carefully, and use the word in a simple sentence.","videoProvider":"DK Books"}], age=3, pool=[], current=null, reviewOnly=false;
const LIMIT={3:300,4:600,5:1000};
const state=JSON.parse(localStorage.getItem("kidsEnglishState")||'{"viewed":{},"mastered":{},"correct":{},"wrong":{}}');
const save=()=>localStorage.setItem("kidsEnglishState",JSON.stringify(state));
const $=id=>document.getElementById(id);

async function load(){
  [...new Set(WORDS.map(x=>x.category))].sort().forEach(c=>{
    const o=document.createElement("option");o.value=c;o.textContent=c;$("category").appendChild(o);
  });
  rebuild(); next();
}
function eligible(){
  const max=LIMIT[age], cat=$("category").value, q=$("search").value.trim().toLowerCase();
  let arr=WORDS.slice(0,max).filter(x=>(cat==="All"||x.category===cat)&&(!q||x.word.toLowerCase().includes(q)));
  if(reviewOnly){
    arr=arr.filter(x=>state.viewed[x.id] && !state.mastered[x.id]);
  }
  return arr;
}
function rebuild(){pool=eligible(); updateProgress();}
function next(){
  rebuild();
  if(!pool.length){ alert("這個條件目前沒有單字。"); return; }
  const recent=current?.id;
  let choices=pool.filter(x=>x.id!==recent);
  current=(choices.length?choices:pool)[Math.floor(Math.random()*(choices.length?choices:pool).length)];
  state.viewed[current.id]=(state.viewed[current.id]||0)+1; save(); render();
}
function render(){
  $("tag").textContent=current.category;
  $("fallback").textContent=current.emoji;
  $("word").textContent=current.word;
  $("sentence").textContent=current["sentence"+age];
  $("story").textContent=current.story;
  $("master").textContent=state.mastered[current.id]?"✅ 已學會":"⭐ 我會了";
  loadImage(current.lookup);
  makeQuiz();
  updateProgress();
}
async function loadImage(term){
  const img=$("photo"), fb=$("fallback");
  img.style.display="none"; fb.style.display="block";
  try{
    const u="https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch="+encodeURIComponent(term)+"&gsrlimit=1&prop=pageimages&piprop=thumbnail&pithumbsize=900&format=json&origin=*";
    const j=await fetch(u).then(r=>r.json());
    const p=j.query && Object.values(j.query.pages)[0];
    if(p?.thumbnail?.source){img.src=p.thumbnail.source;img.alt=term;img.onload=()=>{img.style.display="block";fb.style.display="none"};}
  }catch(e){}
}
function speak(text){
  speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=age===3?.68:age===4?.76:.84;speechSynthesis.speak(u);
}
function video(){
  const provider=current.videoProvider==="Nat Geo Kids"?"Nat Geo Kids":"DK Books";
  const q=`${current.word} ${provider} kids short`;
  window.open("https://www.youtube.com/results?search_query="+encodeURIComponent(q),"_blank");
}
function makeQuiz(){
  const opts=[current,...WORDS.filter(x=>x.category===current.category&&x.id!==current.id).sort(()=>Math.random()-.5).slice(0,2)].sort(()=>Math.random()-.5);
  $("quiz").innerHTML="<b>❓ Which word did you just learn?</b>"+opts.map(o=>`<button data-id="${o.id}">${o.word}</button>`).join("");
  $("quiz").querySelectorAll("button").forEach(b=>b.onclick=()=>{
    if(Number(b.dataset.id)===current.id){b.textContent="✅ "+b.textContent;state.correct[current.id]=(state.correct[current.id]||0)+1;}
    else{b.textContent="❌ "+b.textContent;state.wrong[current.id]=(state.wrong[current.id]||0)+1;}
    save();updateProgress();
  });
}
function updateProgress(){
  const max=LIMIT[age], mastered=WORDS.slice(0,max).filter(x=>state.mastered[x.id]).length, viewed=WORDS.slice(0,max).filter(x=>state.viewed[x.id]).length;
  $("progress").textContent=`${mastered} / ${max}`;
  $("barFill").style.width=(mastered/max*100)+"%";
  $("statsText").innerHTML=`看過 <b>${viewed}</b> 字　｜　學會 <b>${mastered}</b> 字　｜　完成率 <b>${(mastered/max*100).toFixed(1)}%</b>`;
}
document.querySelectorAll(".age").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".age").forEach(x=>x.classList.remove("active"));b.classList.add("active");age=Number(b.dataset.age);reviewOnly=false;rebuild();next();
});
$("category").onchange=()=>{reviewOnly=false;next()};
$("search").oninput=()=>{reviewOnly=false;rebuild();if(pool.length){current=pool[0];render()}};
$("listen").onclick=()=>speak(current.word);
$("readStory").onclick=()=>speak(current.story);
$("video").onclick=video;
$("master").onclick=()=>{state.mastered[current.id]=!state.mastered[current.id];save();render()};
$("next").onclick=next;
$("review").onclick=()=>{reviewOnly=!reviewOnly;$("review").textContent=reviewOnly?"🔁 複習中":"🔁 複習";next()};
$("statsBtn").onclick=()=>{$("stats").style.display=$("stats").style.display==="block"?"none":"block";updateProgress()};
load();
</script>
